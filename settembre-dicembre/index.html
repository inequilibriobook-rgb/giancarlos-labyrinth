  :root { --paper:#F6F1E4; --biro:#1F3D99; --pencil:#4A4A4A; --red:#B8221A; --green:#2E9E5B; --yellow:#F7D43B; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:var(--paper); overflow:hidden; overscroll-behavior:none; }
  body { font-family:"Mali","Comic Sans MS",cursive; color:var(--pencil); -webkit-user-select:none; user-select:none; }
  #wrap { position:relative; height:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; }
  #hud { display:flex; align-items:center; gap:8px; padding:8px 10px 4px; border-bottom:2px solid #B9B4C6; }
  #mid { flex:1; text-align:center; min-width:0; cursor:pointer; }
  #title { font-family:"Chewy","Marker Felt",cursive; color:var(--biro); font-size:19px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sub { font-size:14.5px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #sub.dueRighe { white-space:normal; overflow:visible; text-overflow:clip; font-size:13px; line-height:1.15; } #sub.dueRighe span { display:block; white-space:nowrap; }
  #dots { display:flex; gap:6px; padding:7px 8px 6px; overflow-x:auto; align-items:center; scrollbar-width:none; border-bottom:1px solid #D9D2BE; }
  #dots::-webkit-scrollbar { display:none; }
  #dots button { flex:0 0 auto; min-height:38px; font-size:15px; padding:3px 11px; border-width:2px; border-color:#B9B09A; color:#6B6453; background:#FFFDF4; box-shadow:1px 2px 0 rgba(0,0,0,.12); animation:none; }
  #dots button.done { border-color:#fff; background:#FFE27A; color:#6B5407; box-shadow:0 1px 3px rgba(0,0,0,.28); }
  #dots button.plat { background:linear-gradient(115deg,#FFB3D9,#FFE27A 30%,#A8F0D0 55%,#A8C8FF 78%,#D9B3FF); color:#3A3320; } #dots button.now { border-color:var(--biro); border-width:2.5px; color:var(--biro); }
  .vignT b.chiN { display:block; font:700 13px/1 "Mali",cursive; color:#1E3F9E; -webkit-text-stroke:0; text-shadow:none; letter-spacing:.5px; margin-bottom:4px; text-transform:uppercase; } .matParla .mpf.chiF { filter:drop-shadow(0 6px 10px rgba(0,0,0,.25)); } .sbW { display:inline-block; white-space:nowrap; } .sbW i { display:inline-block; font-style:normal; } .vignT small, .bonusB .sbil small { display:block; font:600 14px/1.2 "Mali",cursive; color:#4A4636; -webkit-text-stroke:0; text-shadow:none; margin-top:5px; letter-spacing:0; } .bonusB .sbil { font:400 21px/1.2 "Chewy",cursive; color:#1E4FC2; letter-spacing:1px; } .bonusB .sbil .sbW { display:inline-block; margin:0; font-size:inherit; } .bonusB .sbil small { font-size:14px; } #dots button.bonusT { font:400 17px/1 "Chewy",cursive; letter-spacing:.5px; } #dots button.bonusT.aperto { background:linear-gradient(115deg,#FFB3D9,#FFE27A 30%,#A8F0D0 55%,#A8C8FF 78%,#D9B3FF); color:#1E4FC2; border-color:#16161D; animation:bonusVivo 1.6s ease-in-out infinite; } #dots button.bonusT.chiuso { background:#E4E1DA; color:#8E897C; border-style:dashed; } #dots button b { font-size:10px; letter-spacing:-1px; } #dots span { flex:0 0 auto; font-size:14px; color:#5F5848; padding:0 2px 0 6px; }
  canvas { flex:1 1 auto; width:100%; min-height:0; touch-action:none; display:block; }
  #bar { display:flex; gap:7px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); border-top:2px solid #B9B4C6; }
  button { font:inherit; font-size:16.5px; color:var(--biro); background:#FFFDF4; border:2.5px solid var(--biro); border-radius:26px 20px 28px 18px / 20px 28px 18px 26px; padding:6px 12px; min-height:44px; cursor:pointer; white-space:nowrap; box-shadow:2px 3px 0 rgba(31,61,153,.22); animation:molleggia 3.2s ease-in-out infinite; }
  button:nth-of-type(2n) { border-radius:20px 28px 18px 26px / 26px 18px 28px 20px; animation-delay:-1.1s; } button:nth-of-type(3n) { animation-delay:-2.1s; }
  @keyframes molleggia { 0%,100% { transform:rotate(-.6deg) scale(1); } 50% { transform:rotate(.6deg) scale(1.025); } }
  button.pop { animation:scoppia .34s ease-out; } @keyframes scoppia { 0% { transform:scale(1); } 45% { transform:scale(1.28); opacity:.55; } 60% { transform:scale(.3); opacity:0; } 100% { transform:scale(1); opacity:1; } }
